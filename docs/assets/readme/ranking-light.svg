  <title id="t">Pass@1 on Full-Duplex-Bench v3</title>
  <desc id="d">Pass@1 in percent. Commercial systems, as reported: GPT-Realtime 60.0; Gemini Live 3.1 54.0; MOSS-Live 51.0; Gemini Live 2.5 49.0; Cascaded 45.0; Grok 43.0; Ultravox v0.7 41.0. Open-source systems and Duopra: Duopra, DeepSeek backend 49.3 ± 3.5; Hu et al., Qwen3-235B backend 48.0 (reported); Duopra, calling tools itself 47.7 ± 3.5; DuplexAgent-RSI 47.0 (reported); Duopra, Qwen3-8B backend 44.7 ± 5.7; Realtime-Venus-Audio, offline 42.0 (reported); Gander, GPT-5.6 40.0 (reported); NemotronLabs VoiceChat 33.0 (reported). Published results are reference points, not a common-protocol ranking.</desc>
