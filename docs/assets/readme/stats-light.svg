<svg xmlns="http://www.w3.org/2000/svg" width="880" height="120" viewBox="0 0 880 120" role="img" aria-labelledby="t d">
  <title id="t">Duopra in four numbers</title>
  <desc id="d">49.3% of tasks passed with a backend (Pass@1 on Full-Duplex-Bench v3, delegating through query(task) to DeepSeek); 47.7% of tasks passed calling tools itself (Pass@1 over 300 sessions); 1.8× the pass rate from full-duplex RL (26.0% after SFT, 47.7% after RL); 91.3% of interruptions answered (Full-Duplex-Bench v1.0).</desc>
  <rect width="880" height="120" rx="18" fill="#f6f8fb"/>
  <rect x=".5" y=".5" width="879" height="119" rx="17.5" fill="none" stroke="#18202d" stroke-opacity=".12"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="42.0" y="55" fill="#1d1d1f" font-size="32" font-weight="600" letter-spacing="-1">49.3<tspan dx="1.5" font-size="20" font-weight="400" fill="#6b7280">%</tspan></text>
    <text x="42.0" y="78" fill="#424245" font-size="12.5" font-weight="500">of tasks passed</text>
    <text x="42.0" y="95" fill="#424245" font-size="12.5" font-weight="500">with a backend</text>
    <path d="M219.0 30V92" stroke="#18202d" stroke-opacity=".10"/>
    <text x="245.0" y="55" fill="#1d1d1f" font-size="32" font-weight="600" letter-spacing="-1">47.7<tspan dx="1.5" font-size="20" font-weight="400" fill="#6b7280">%</tspan></text>
    <text x="245.0" y="78" fill="#424245" font-size="12.5" font-weight="500">of tasks passed,</text>
    <text x="245.0" y="95" fill="#424245" font-size="12.5" font-weight="500">calling tools itself</text>
    <path d="M422.0 30V92" stroke="#18202d" stroke-opacity=".10"/>
    <text x="448.0" y="55" fill="#1d1d1f" font-size="32" font-weight="600" letter-spacing="-1">1.8<tspan dx="1.5" font-size="20" font-weight="400" fill="#6b7280">×</tspan></text>
    <text x="448.0" y="78" fill="#424245" font-size="12.5" font-weight="500">the pass rate</text>
    <text x="448.0" y="95" fill="#424245" font-size="12.5" font-weight="500">from full-duplex RL</text>
    <path d="M625.0 30V92" stroke="#18202d" stroke-opacity=".10"/>
    <text x="651.0" y="55" fill="#1d1d1f" font-size="32" font-weight="600" letter-spacing="-1">91.3<tspan dx="1.5" font-size="20" font-weight="400" fill="#6b7280">%</tspan></text>
    <text x="651.0" y="78" fill="#424245" font-size="12.5" font-weight="500">of interruptions</text>
    <text x="651.0" y="95" fill="#424245" font-size="12.5" font-weight="500">answered</text>
  </g>
</svg>
