<svg xmlns="http://www.w3.org/2000/svg" width="880" height="292" viewBox="0 0 880 292" role="img" aria-labelledby="t d">
  <title id="t">Recorded session 01: the call goes out while Duopra is speaking</title>
  <desc id="d">Two waveform lanes over 30 seconds. The user asks for 100 euros in US dollars, then corrects it to 150. Duopra starts answering at 16.7 s (&#x27;I will check the current exchange rate for you.&#x27;) and at 19.05 s, mid-sentence, sends get_exchange_rate(amount: 150, from_currency: EUR, to_currency: USD); the result, 165.0, is reported from 22.2 s.</desc>
