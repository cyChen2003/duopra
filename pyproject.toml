[project]
name = "duopra"
version = "0.1.0"
description = "Native duplex audio application for NVIDIA CUDA"
requires-python = ">=3.10,<3.13"
readme = "README.md"
dependencies = [
    "fastapi==0.121.3",
    "starlette==0.50.0",
    "uvicorn==0.38.0",
    "websockets==15.0.1",
    "pydantic==2.12.4",
    "pydantic-core==2.41.5",
    "annotated-types==0.7.0",
    "annotated-doc==0.0.4",
    "anyio==4.11.0",
    "sniffio==1.3.1",
    "idna==3.11",
    "h11==0.16.0",
    "click==8.3.1",
    "typing-extensions==4.15.0",
    "typing-inspection==0.4.2",
    "exceptiongroup==1.3.1",
    "numpy==1.26.4",
    "scipy==1.15.3",
    "soundfile==0.13.1",
    "cffi==2.0.0",
    "pycparser==2.23",
    "safetensors==0.5.3",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
]
# Use the base minicpmo-utils distribution to preserve the Transformers pin.
model = [
    "transformers==4.57.6",
    "minicpmo-utils==1.0.6",
    "s3tokenizer==0.3.0",
    "soxr==1.1.0",
    "onnxruntime==1.21.0",
    "onnx>=1.16,<2",
    "hyperpyyaml==1.2.3",
    "diffusers==0.33.1",
    "einops==0.8.1",
    "sentencepiece>=0.2,<0.3",
    "xxhash>=3,<5",
    "packaging>=24,<25",
    "setuptools>=70,<81",
]
[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[build-system]
requires = ["setuptools>=70,<81"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
